[project]
name = "nkfont"
version = "0.1.0"
description = "Build pipeline for nk-nerd-font (NK Sans / NK Serif / NK Pixel)"
requires-python = ">=3.11"
license = "MIT"  # build tooling; the fonts themselves are OFL-1.1 (OFL.txt)
# Exact pins: fontTools affects output bytes (reproducible builds), wcwidth is the terminal width
# table the checks enforce, Pillow (bundled FreeType) affects golden-image renders.
dependencies = [
  "fonttools[woff]==4.68.0",
  "wcwidth==0.9.4",
  "pillow==13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
nkfont = "nkfont.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs downloaded upstream fonts (run `nkfont fetch` first)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
