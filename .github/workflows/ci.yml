name: build

# Budget guard: docs-only changes skip the build, a newer push to a PR cancels its older run,
# and every job has a hard time limit. A full run is ~6 jobs x 10-18 min.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - "OFL.txt"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - "OFL.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        family: [sans, serif, mono, pixel, novel, comics]
    env:
      SOURCE_DATE_EPOCH: "1798761600"  # fixed font timestamps (reproducible builds)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: sources
          key: sources-${{ hashFiles('sources.lock') }}
      - name: nkfont qa --profile ci
        run: nkfont qa --profile ci --family ${{ matrix.family }} --report-dir reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nk-${{ matrix.family }}-${{ github.sha }}
          path: |
            dist/*.ttf
            reports/
          retention-days: 14
