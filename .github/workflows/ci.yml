name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        family: [sans, serif, mono, pixel, novel, comics]
    env:
      SOURCE_DATE_EPOCH: "1798761600"  # fixed font timestamps (reproducible builds)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: sources
          key: sources-${{ hashFiles('sources.lock') }}
      - name: nkfont qa --profile ci
        run: nkfont qa --profile ci --family ${{ matrix.family }} --report-dir reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nk-${{ matrix.family }}-${{ github.sha }}
          path: |
            dist/*.ttf
            reports/
          retention-days: 14
