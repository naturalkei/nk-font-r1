# Local-only reference fonts: free to use, but their terms do not clearly allow redistribution,
# so they are never committed, never pinned in sources.lock and never downloaded by `nkfont fetch`.
# Each owner installs the font from its official distributor; nkfont finds the file by name in
#   sources/local/, $NK_LOCAL_FONTS (os.pathsep list), ~/Library/Fonts, /Library/Fonts,
#   ~/.local/share/fonts, ~/.fonts
# and shows it next to NK glyphs in the Glyph Lab (/lab, /lab/advanced, /presets) when found.
# They are only measured and drawn for comparison: never merged, subset, re-wrapped or shipped
# (no WOFF2 on the site), and nothing here is a build input.
#
# Fields: id, label (Lab chip), license (what we verified), homepage, weights = {Lab weight =
# [file names or glob patterns to look for, first match wins]}, optional sha256 = {file name =
# digest} to warn when a different release is installed.

[[font]]
# 만화진흥원체 (KOMACON), Korea Manhwa Contents Agency. Comic speech-bubble lettering; NK Comics
# reference only. The upload (2026-11-03) ships just a Mac/Windows installer (YoonfontInstall,
# payload packed) and a vertical-writing usage PDF: no license text we could read, and no public
# license page found, so it is treated as non-redistributable. Install it with the official
# KomaconFonts.dmg / .exe; the installed file is KOMACON.ttf.
id = "komacon"
label = "만화진흥원체 (KOMACON, 로컬)"
license = "free font, redistribution terms unverified: local only"
homepage = "https://www.komacon.kr/"
weights = { Regular = ["KOMACON.ttf", "KOMACON.otf"] }

[[font]]
# HCL 리얼노트필기: the pen-handwriting feel the user wants for NK Comics (2026-11-03 sample).
# No license text found, so local only; shape reference, never a glyph source. The installed
# file name is unknown, so match by pattern.
id = "hcl-realnote"
label = "HCL 리얼노트필기 (로컬)"
license = "license unverified: local only"
weights = { Regular = ["HCL*리얼노트*.ttf", "HCL*리얼노트*.otf", "*RealNote*.ttf", "*RealNote*.otf", "*Realnote*.ttf", "*Realnote*.otf"] }

[[font]]
# KoPubWorld 바탕체 (한국출판인회의): the batang most Korean books and e-books are set in, the
# reading voice NK Novel is measured against. Free to use, but the KoPub terms limit
# redistribution, so local only. Install from the official KoPub site.
id = "kopub-batang"
label = "KoPubWorld 바탕 (로컬)"
license = "free font, redistribution limited by its terms: local only"
homepage = "https://www.kopus.org/biz-electronic-font2/"
families = ["novel"]
weights = { Regular = ["KoPubWorld*Batang*Medium.ttf", "KoPubWorld*Batang*Medium.otf", "KoPub*Batang*Medium.ttf", "KoPubWorld*바탕*Medium.ttf", "KoPubWorld*Batang*Light.ttf"], Bold = ["KoPubWorld*Batang*Bold.ttf", "KoPubWorld*Batang*Bold.otf", "KoPub*Batang*Bold.ttf"] }

[[font]]
# 마루 부리 (Naver, 2021): contemporary document myeongjo. Distributed only from Naver's
# hangeul site (not reachable from our pinned hosts), so it is looked up locally instead of
# fetched; never committed or shipped either way.
id = "maruburi"
label = "마루 부리 (로컬)"
license = "free font from hangeul.naver.com: local only"
homepage = "https://hangeul.naver.com/font"
families = ["serif"]
weights = { Regular = ["MaruBuri-Regular.ttf", "MaruBuri-Regular.otf", "MaruBuriTTF-Regular.ttf"], Bold = ["MaruBuri-Bold.ttf", "MaruBuri-Bold.otf", "MaruBuriTTF-Bold.ttf"] }
