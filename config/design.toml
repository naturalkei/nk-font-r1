# Design notes page (site/design.html, `nkfont site` -> design.json).
#
# Each [[glyph]] is drawn from the real outline of every family's Regular master, with its metric
# guides, golden-ratio (phi) grid, measured stroke thickness, on/off-curve points and an animated
# stroke order. Stroke skeletons are written here in ink-box coordinates (0..1, y up, (0,0) =
# bottom-left of the glyph's ink box) and snapped at build time onto the centre of the nearest real
# stroke, so the same skeleton follows each family's drawing. A point that finds no ink within
# `snap_radius` (share of the larger ink-box side) is kept where it is and reported as a miss.
# A stroke is `pts` (level/plumb segments snap onto a bar/stem as a whole) or `ring = [u, v, ru, rv]`
# (a bowl traced around its counter, counter-clockwise from the top, as ㅇ and 0 are written).

[page]
families = ["mono", "serif", "pixel", "sans", "novel", "comics"]
snap_radius = 0.16
# A glyph whose skeleton misses more points than this in a family shows no stroke order there
# (the outline, guides and measurements still show).
max_misses = 2
# Ratios printed on a note are matched to the nearest step of the shared scale phi^(step/6)
# (config/proportions.toml) and called "on phi" within this tolerance.
phi_tolerance = 0.02

