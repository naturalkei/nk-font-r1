# NK Serif: proportional document serif for reports, papers, letters and print layouts (not a
# terminal font; the terminal family is NK Mono). IBM Plex Serif (RFN "Plex") + Source Han Serif KR
# (RFN "Source"). Shares Plex's skeleton with NK Sans, so the two pair as heading/body faces.
# NK Novel is the long-form book face; NK Serif is the crisper document face.
# kind = "text": no terminal grid, no Nerd Fonts icons; Hangul keeps its own spacing.
status = "active"
kind = "text"
family = "NK Serif"
file_prefix = "NKSerif"
version = "0.2.0"
copyright = """Copyright 2026 naturalk (nk-font). \
Copyright 2017 IBM Corp., with Reserved Font Name 'Plex'. \
Copyright 2017-2024 Adobe (http://www.adobe.com/), with Reserved Font Name 'Source'."""

[hangul]
# For a 1000-UPM source. Source Han Serif Hangul set a little under Plex Serif's cap-to-descender
# span, like NK Sans, so a document can switch between the two without reflowing much. Scale and
# width follow the φ proportion rules (config/proportions.toml: hangul_height, hangul_aspect).
scale = 0.88
dy = 0
center = "advance"
# Target units added to every Hangul advance (negative = tighter); document text, not books.
tracking = -20
# Myeongjo hairlines vanish at small sizes; Hangul is mapped one weight heavier than Latin
# (Regular -> Medium) in the [[weight]] table below.
width = 0.95
slant = 0.0
grade = 0.0

[metrics]
# Default line = φ^(5/6) = 1.493 em, the same document line as NK Sans (phi.py, scale step 5).
ascent = 1025
descent = -275
line_height = "phi^5/6"

[weights]
# Thin..ExtraBold. Plex Serif ships Thin..Bold; ExtraBold is Plex Serif Bold + 24 units.
# Hangul: the Source Han Serif master nearest to each Latin weight (Regular keeps its
# one-heavier Medium), then a solved grade ("stem+bar", weights.py). Myeongjo and serif weights
# change their stems, not their hairlines, so grades move horizontal strokes only 30%.
match = "stem+bar"
reference = "Regular"
contrast = 0.3

# Regular first: tools open the first weight. The rest follow in weight-class order.

[[weight]]
name = "Regular"
latin = "plex-serif-regular"
hangul = "source-han-serif-kr-medium"
weight_class = 400

[[weight]]
name = "Bold"
latin = "plex-serif-bold"
hangul = "source-han-serif-kr-heavy"
weight_class = 700

[[weight]]
name = "Thin"
latin = "plex-serif-thin"
hangul = "source-han-serif-kr-extralight"
weight_class = 100

[[weight]]
name = "ExtraLight"
latin = "plex-serif-extralight"
hangul = "source-han-serif-kr-extralight"
weight_class = 200

[[weight]]
name = "Light"
latin = "plex-serif-light"
hangul = "source-han-serif-kr-light"
weight_class = 300

[[weight]]
name = "Medium"
latin = "plex-serif-medium"
hangul = "source-han-serif-kr-bold"
weight_class = 500

[[weight]]
name = "SemiBold"
latin = "plex-serif-semibold"
hangul = "source-han-serif-kr-heavy"
weight_class = 600

[[weight]]
name = "ExtraBold"
latin = "plex-serif-bold"
latin_grade = 24
hangul = "source-han-serif-kr-heavy"
weight_class = 800
