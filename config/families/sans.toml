# NK Sans: proportional document sans for general documents, UI and slides (not a terminal font;
# the terminal family is NK Mono). IBM Plex Sans (RFN "Plex") + Source Han Sans KR (RFN "Source").
# kind = "text": no terminal grid, no Nerd Fonts icons; Hangul keeps its own spacing.
status = "active"
kind = "text"
family = "NK Sans"
file_prefix = "NKSans"
version = "0.2.0"
copyright = """Copyright 2026 naturalk (nk-font). \
Copyright 2017 IBM Corp., with Reserved Font Name 'Plex'. \
Copyright 2014-2025 Adobe (http://www.adobe.com/), with Reserved Font Name 'Source'."""

[hangul]
# For a 1000-UPM source. Source Han Sans Hangul (가 ~900 tall) set a little under Plex Sans's
# cap-to-descender span so mixed Korean/English lines keep an even colour.
scale = 0.9
dy = 0
center = "advance"
# Target units added to every Hangul advance: Source Han Sans's 920 advance is roomy for text.
tracking = -20
# Fine tuning from the Glyph Lab (`nkfont studio` -> /lab). Defaults leave outlines untouched.
# Extra horizontal scale on top of `scale` (Hangul proportions next to Latin).
width = 1.0
# Skew in degrees, positive leans right; reserved for italics (match the Latin italic angle).
slant = 0.0
# Stem weight change in font units without moving advances, like a GRAD axis (+ is darker).
grade = 0.0

[metrics]
# Default line = φ^(5/6) = 1.493 em, a document line height (phi.py, shared modular scale step 5).
ascent = 1025
descent = -275
line_height = "phi^5/6"

[weights]
# Thin..ExtraBold. Plex Sans ships Thin..Bold; ExtraBold is Plex Bold + 24 units (latin_grade).
# Hangul: the Source Han Sans master nearest to each Latin weight, then a solved grade and
# contrast keep Hangul stem and bar / Latin stem and bar at Regular's ratios (weights.py).
match = "stem+bar"
reference = "Regular"

# Regular first: tools open the first weight. The rest follow in weight-class order.

[[weight]]
name = "Regular"
latin = "plex-sans-regular"
hangul = "source-han-sans-kr-regular"
weight_class = 400

[[weight]]
name = "Bold"
latin = "plex-sans-bold"
hangul = "source-han-sans-kr-heavy"
weight_class = 700

[[weight]]
name = "Thin"
latin = "plex-sans-thin"
hangul = "source-han-sans-kr-extralight"
weight_class = 100

[[weight]]
name = "ExtraLight"
latin = "plex-sans-extralight"
hangul = "source-han-sans-kr-extralight"
weight_class = 200

[[weight]]
name = "Light"
latin = "plex-sans-light"
hangul = "source-han-sans-kr-light"
weight_class = 300

[[weight]]
name = "Medium"
latin = "plex-sans-medium"
hangul = "source-han-sans-kr-medium"
weight_class = 500

[[weight]]
name = "SemiBold"
latin = "plex-sans-semibold"
hangul = "source-han-sans-kr-bold"
weight_class = 600

[[weight]]
name = "ExtraBold"
latin = "plex-sans-bold"
latin_grade = 24
hangul = "source-han-sans-kr-heavy"
weight_class = 800
