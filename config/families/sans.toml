# NK Sans: JetBrains Mono (Latin) + Source Han Sans KR (Hangul).
# Every tunable lives here so builds are reproducible and the tuning tool can edit one file.
status = "active"
family = "NK Sans"
file_prefix = "NKSans"
version = "0.1.0"

[hangul]
# Uniform scale applied to Hangul outlines, expressed for a 1000-UPM source (rescaled automatically).
scale = 0.96
# Vertical offset in target units after scaling (positive moves up).
dy = -10
# Horizontal placement inside the full-width cell: "advance" keeps the source spacing centered.
center = "advance"
# Imported ink may use at most this share of its cell width; wider source glyphs (Source Han
# Sans "halfwidth" jamo are 920 wide) are shrunk uniformly to fit.
fit = 0.92
# Fine tuning from the Glyph Lab (`nkfont studio` -> /lab). Defaults leave outlines untouched.
# Extra horizontal scale on top of `scale` (Hangul proportions next to Latin).
width = 1.0
# Skew in degrees, positive leans right; reserved for italics (match the Latin italic angle).
slant = 0.0
# Stem weight change in font units without moving advances, like a GRAD axis (+ is darker).
grade = 0.0

[[weight]]
name = "Regular"
latin = "jetbrains-mono-regular"
hangul = "source-han-sans-kr-regular"
weight_class = 400

[[weight]]
name = "Bold"
latin = "jetbrains-mono-bold"
hangul = "source-han-sans-kr-bold"
weight_class = 700
