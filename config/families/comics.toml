# NK Comics: exaggerated lettering for comics, webtoons, speech bubbles and sound effects.
# Regular = Bagel Fat One (bouncy, heavy, round), Black = Gasoek One (condensed shout). Each source
# already pairs its own Latin and Hangul; they cover 2,780 syllables, and the remaining modern
# syllables are filled from Source Han Sans KR Heavy (scaled to match) so no text falls back.
# kind = "text": no terminal grid, no Nerd Fonts icons.
status = "active"
kind = "text"
family = "NK Comics"
file_prefix = "NKComics"
version = "0.2.0"
copyright = """Copyright 2026 naturalk (nk-font). \
Copyright 2022 The Bagel Fat Project Authors. \
Copyright 2022 The Gasoek Project Authors. \
Copyright 2014-2025 Adobe (http://www.adobe.com/), with Reserved Font Name 'Source'."""

[hangul]
# Fill-in syllables only (the "latin" source already has the common 2,780). Source Han Sans Heavy
# 가 is ~904 tall; Bagel Fat One's is ~863.
scale = 0.95
dy = 0
tracking = -40

[metrics]
# Speech bubbles are set tight: default line = √φ = 1.272 em (phi.py). Display ascent/descent.
ascent = 960
descent = -312
line_height = "phi^0.5"

[weights]
# Thin..ExtraBold plus Black. Bagel Fat One is one heavy weight that already pairs Latin and
# Hangul, so the others move its stems (latin_grade, units at UPM 1000); Black stays Gasoek One.
# Fill-in syllables come from the Source Han Sans master nearest to each weight with a solved
# grade, so they match the Bagel strokes around them ("stem+bar", weights.py).
match = "stem+bar"
reference = "Regular"
# The fill-in syllables must match the lettering's own Hangul, not its Latin: probe Bagel's
# (and Gasoek's) ㅣ and ㅡ in the "latin" source.
latin_probe = "ㅣ"
latin_bar_probe = "ㅡ"
# Black is Gasoek One's own Latin + Hangul pairing, a different lettering: QA does not compare
# its Hangul/Latin ratios with Bagel Fat One's Regular.
independent = ["Black"]

# Regular first: tools open the first weight. The rest follow in weight-class order.

[[weight]]
name = "Regular"
latin = "bagel-fat-one"
hangul = "source-han-sans-kr-heavy"
weight_class = 400

[[weight]]
name = "Black"
latin = "gasoek-one"
hangul = "source-han-sans-kr-heavy"
weight_class = 900

[[weight]]
name = "Thin"
latin = "bagel-fat-one"
latin_grade = -60
hangul = "source-han-sans-kr-regular"
weight_class = 100

[[weight]]
name = "ExtraLight"
latin = "bagel-fat-one"
latin_grade = -42
hangul = "source-han-sans-kr-medium"
weight_class = 200

[[weight]]
name = "Light"
latin = "bagel-fat-one"
latin_grade = -22
hangul = "source-han-sans-kr-bold"
weight_class = 300

[[weight]]
name = "Medium"
latin = "bagel-fat-one"
latin_grade = 15
hangul = "source-han-sans-kr-heavy"
weight_class = 500

[[weight]]
name = "SemiBold"
latin = "bagel-fat-one"
latin_grade = 30
hangul = "source-han-sans-kr-heavy"
weight_class = 600

[[weight]]
name = "Bold"
latin = "bagel-fat-one"
latin_grade = 45
hangul = "source-han-sans-kr-heavy"
weight_class = 700

[[weight]]
name = "ExtraBold"
latin = "bagel-fat-one"
latin_grade = 60
hangul = "source-han-sans-kr-heavy"
weight_class = 800
