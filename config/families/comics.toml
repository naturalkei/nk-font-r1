# NK Comics: pen-handwritten lettering for comics, webtoons, speech bubbles and diaries.
# Light/Regular/Bold = Gaegu (개구, OFL, no RFN): one felt-pen hand that draws both Latin and
# Hangul. Gaegu covers the 2,350 KS X 1001 syllables; the other 8,822 modern syllables are filled
# from Nanum Pen Script (나눔손글씨 펜, OFL) scaled to match, so no text falls back to another font.
# Gaegu's own Hangul is imported again (`replace`) so [hangul] can line it up with the Latin:
# Gaegu's Latin leans right while its Hangul stands upright, and its Hangul sits tall.
# kind = "text": no terminal grid, no Nerd Fonts icons.
status = "active"
kind = "text"
family = "NK Comics"
file_prefix = "NKComics"
version = "0.3.0"
copyright = """Copyright 2026 naturalk (nk-font). \
Copyright 2018 The Gaegu Project Authors (https://github.com/JAMO-TYPEFACE/Gaegu). \
Copyright 2010 NAVER Corporation, with Reserved Font Name 'Nanum', 'NanumPen'."""

[hangul]
# Gaegu's Hangul, imported again: 0.95 brings it to 1.27 × the cap height (band 1.05-1.32),
# dy -25 sets its centre ~45 units above the caps' instead of ~70, slant 4.5° matches the lean
# of the Latin (l I i lean ~4.5° right, the Hangul stands upright), tracking opens the
# Hangul spacing towards the Latin's.
replace = true
scale = 0.95
dy = -25
slant = 4.5
tracking = 20

[fill]
# Nanum Pen Script relative to the Gaegu Hangul above (scale multiplies, dy/grade/slant add).
# Its syllables are drawn smaller (0.96 × cap height at the same scale), lower in the em,
# a little left-leaning and tighter; one Regular source serves all weights (fill_adjust).
scale = 1.33
dy = -108
slant = 3
grade = -13
tracking = 40

[metrics]
# Speech bubbles are set tight: default line = √φ = 1.272 em (phi.py). Display ascent/descent.
ascent = 960
descent = -312
line_height = "phi^0.5"

[weights]
# Thin..ExtraBold. Gaegu ships Light, Regular and Bold; the others move the nearest master's
# strokes (latin_grade, units at UPM 1000): Thin and ExtraLight from Light, Medium from Regular,
# SemiBold and ExtraBold from Bold. The Hangul (Gaegu's own, re-imported) gets a solved grade so
# Hangul stem / Latin stem stays the Regular's ("stem+bar", weights.py); the Nanum Pen fill-in
# syllables take the same grade plus the weight's fill_adjust.
match = "stem+bar"
reference = "Regular"

# Regular first: tools open the first weight. The rest follow in weight-class order.

[[weight]]
name = "Regular"
latin = "gaegu-regular"
hangul = "gaegu-regular"
fill = "nanum-pen-script"
weight_class = 400

[[weight]]
name = "Thin"
latin = "gaegu-light"
latin_grade = -18
hangul = "gaegu-light"
fill = "nanum-pen-script"
fill_adjust = { grade = -37 }
weight_class = 100

[[weight]]
name = "ExtraLight"
latin = "gaegu-light"
latin_grade = -10
hangul = "gaegu-light"
fill = "nanum-pen-script"
fill_adjust = { grade = -37 }
weight_class = 200

[[weight]]
name = "Light"
latin = "gaegu-light"
hangul = "gaegu-light"
fill = "nanum-pen-script"
fill_adjust = { grade = -37 }
weight_class = 300

[[weight]]
name = "Medium"
latin = "gaegu-regular"
latin_grade = 7
hangul = "gaegu-regular"
fill = "nanum-pen-script"
weight_class = 500

[[weight]]
name = "SemiBold"
latin = "gaegu-bold"
latin_grade = -8
hangul = "gaegu-bold"
fill = "nanum-pen-script"
fill_adjust = { grade = 8 }
weight_class = 600

[[weight]]
name = "Bold"
latin = "gaegu-bold"
hangul = "gaegu-bold"
fill = "nanum-pen-script"
fill_adjust = { grade = 8 }
weight_class = 700

[[weight]]
name = "ExtraBold"
latin = "gaegu-bold"
latin_grade = 15
hangul = "gaegu-bold"
fill = "nanum-pen-script"
fill_adjust = { grade = 8 }
weight_class = 800
