# NK Comics: exaggerated lettering for comics, webtoons, speech bubbles and sound effects.
# Regular = Bagel Fat One (bouncy, heavy, round), Black = Gasoek One (condensed shout). Each source
# already pairs its own Latin and Hangul; they cover 2,780 syllables, and the remaining modern
# syllables are filled from Source Han Sans KR Heavy (scaled to match) so no text falls back.
# kind = "text": no terminal grid, no Nerd Fonts icons.
status = "active"
kind = "text"
family = "NK Comics"
file_prefix = "NKComics"
version = "0.2.0"
copyright = """Copyright 2026 naturalk (nk-font). \
Copyright 2022 The Bagel Fat Project Authors. \
Copyright 2022 The Gasoek Project Authors. \
Copyright 2014-2025 Adobe (http://www.adobe.com/), with Reserved Font Name 'Source'."""

[hangul]
# Fill-in syllables only (the "latin" source already has the common 2,780). Source Han Sans Heavy
# 가 is ~904 tall; Bagel Fat One's is ~863.
scale = 0.95
dy = 0
tracking = -40

[metrics]
# Speech bubbles are set tight: default line = √φ = 1.272 em (phi.py). Display ascent/descent.
ascent = 960
descent = -312
line_height = "phi^0.5"

[[weight]]
name = "Regular"
latin = "bagel-fat-one"
hangul = "source-han-sans-kr-heavy"
weight_class = 400

[[weight]]
name = "Black"
latin = "gasoek-one"
hangul = "source-han-sans-kr-heavy"
weight_class = 900
