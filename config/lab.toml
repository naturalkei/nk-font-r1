# Glyph Lab (`nkfont studio` -> /lab): comparison fonts and glyph presets.
# Reference fonts come from sources.lock (`nkfont fetch`); they are only measured and shown,
# never merged or shipped. Besides `id`, `label` and the weights (Lab weight = sources.lock id):
#   families  NK families the reference is meant for; the Lab and /presets list those first
#   role      what it is compared for: "hangul", "latin" or "both"

[[reference]]
id = "jetbrains-mono"
families = ["mono"]
role = "latin"
label = "JetBrains Mono"
Regular = "jetbrains-mono-regular"
Bold = "jetbrains-mono-bold"

