<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NK Update</title>
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#1c1b19;--mute:#6d6a63;--line:#e4e1d9;--acc:#1f7a6d;--warn:#c2571a}
@media (prefers-color-scheme:dark){:root{--bg:#121311;--panel:#1b1c1a;--ink:#ecebe6;--mute:#9a978f;--line:#2d2e2b;--acc:#5cc6b4;--warn:#f08a4b}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header.top{display:flex;align-items:center;gap:18px;padding:12px 20px;border-bottom:1px solid var(--line)}
header.top b{font-size:16px}nav a{color:var(--mute);text-decoration:none;margin-right:14px;font-size:13px}nav a.on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--acc);padding-bottom:3px}
.wrap{max-width:760px;margin:0 auto;padding:36px 20px}
h1{font-size:28px;font-weight:500;margin:0 0 6px}.mute{color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:20px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:13px}.kv span:nth-child(odd){color:var(--mute)}
code,.mono{font-family:ui-monospace,monospace;font-size:12px}
ul{margin:8px 0 0;padding-left:18px}li{font:12px/1.7 ui-monospace,monospace}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 14px;cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}button:disabled{opacity:.4;cursor:default}
.msg{margin-top:14px;font-size:13px}.msg.warn{color:var(--warn)}.msg.ok{color:var(--acc)}
</style>
</head>
<body>
<header class="top"><b>NK Studio</b>
  <nav><a href="/specimen">스페시먼</a><a href="/presets">프리셋 비교</a><a href="/">한글 미세 조절</a><a href="/lab">글리프 랩</a><a href="/site/">미리보기 사이트</a><a href="/update" class="on">업데이트</a></nav>
</header>
<div class="wrap">
  <h1>업데이트</h1>
  <div class="mute">앱은 레포를 그대로 실행하므로 업데이트 = <code>git pull --ff-only</code>. 커밋하지 않은 변경이나 로컬 커밋이 있으면 건드리지 않고 멈춥니다.</div>
  <div class="card">
    <div class="kv" id="kv"><span>상태</span><span>확인 중…</span></div>
    <div id="log"></div>
    <div class="row">
      <button id="check">다시 확인</button>
      <button class="primary" id="apply" disabled>업데이트</button>
      <button id="restart" hidden>다시 시작</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
async function api(path) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
  const j = await r.json(); if (j.error) throw new Error(j.error); return j;
}
function say(t, cls = "") { $("msg").className = "msg " + cls; $("msg").textContent = t; }
let isApp = false;

async function check() {
  say("원격 저장소 확인 중…"); $("apply").disabled = true;
  try {
    const s = await api("/api/update/check"); isApp = s.app;
    const state = s.behind ? `새 커밋 ${s.behind}개` : "최신";
    $("kv").innerHTML = [["상태", state], ["브랜치", `${s.branch} ← ${s.upstream}`], ["현재", s.head],
      ["로컬 커밋", s.ahead || "없음"], ["변경 파일", s.dirty.length ? s.dirty.slice(0, 6).join(", ") + (s.dirty.length > 6 ? " …" : "") : "없음"]]
      .map(([k, v]) => `<span>${k}</span><span class="mono">${esc(v)}</span>`).join("");
    $("log").innerHTML = s.commits.length ? `<ul>${s.commits.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : "";
    $("apply").disabled = !s.can_update;
    if (!s.behind) say("이미 최신입니다.", "ok");
    else if (s.dirty.length) say("커밋하지 않은 변경이 있어 자동 업데이트를 막았습니다. 먼저 커밋하거나 정리하세요.", "warn");
    else if (s.ahead) say("로컬 커밋이 있어 fast-forward가 안 됩니다. 터미널에서 직접 pull/merge 하세요.", "warn");
    else say("업데이트할 수 있습니다.");
  } catch (e) { say(e.message, "warn"); }
}

$("check").onclick = check;
$("apply").onclick = async () => {
  $("apply").disabled = true; say("받는 중…");
  try {
    const r = await api("/api/update/apply");
    say(`${r.message}${r.reinstalled ? " (의존성 재설치 완료)" : ""}  ${r.from || ""} → ${r.head}`, "ok");
    if (r.updated) { $("restart").hidden = false; if (!isApp) say(r.message.replace("다시 시작하면", "터미널에서 nkfont studio를 다시 실행하면"), "ok"); }
  } catch (e) { say(e.message, "warn"); check(); }
};
$("restart").onclick = async () => {
  try { await api("/api/app/restart"); say("다시 시작하는 중…"); } catch (e) { say(e.message, "warn"); }
};
check();
</script>
</body>
</html>
